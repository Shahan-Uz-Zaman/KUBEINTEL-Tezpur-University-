apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeintel-frontend
  namespace: kubeintel
  labels:
    app: kubeintel-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeintel-frontend
  template:
    metadata:
      labels:
        app: kubeintel-frontend
    spec:
      containers:
        - name: frontend
          image: kubeintel-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeintel-frontend
  namespace: kubeintel
spec:
  selector:
    app: kubeintel-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: NodePort
